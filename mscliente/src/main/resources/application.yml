spring:
  application:
    name: ms-cliente

  datasource:
    url: jdbc:postgresql://localhost:5432/ms_cliente
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


server:
  port: 8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html