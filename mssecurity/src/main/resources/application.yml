spring:
  application:
    name: ms-security

  datasource:
    url: jdbc:postgresql://localhost:5432/ms_security
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVEhTMjU2QXRMZWFzdDMyQ2hhcnNMb25n}
    expiration-ms: ${JWT_EXPIRATION:86400000}

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html